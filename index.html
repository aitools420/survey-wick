<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critical Crypto Survey — $WICK | WICK.PICS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Critical Crypto Survey — survey.wick.pics">
<meta property="og:description" content="Invoke your inner cypher-punk">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface-hi:#1c2129;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--primary:#a1faff;--green:#3fb950;--accent:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.survey-container{max-width:600px;width:100%;padding:24px;position:relative}

/* Character + speech bubble */
.character-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:32px}
.character-img{width:120px;height:120px;border-radius:50%;border:3px solid var(--primary);flex-shrink:0;object-fit:cover;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(161,250,255,.3)}50%{box-shadow:0 0 24px rgba(161,250,255,.7),0 0 48px rgba(63,185,80,.3)}}
.speech-bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px;font-size:1.05rem;line-height:1.5;flex:1}
.speech-bubble::before{content:'';position:absolute;left:-12px;top:20px;width:20px;height:16px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0 0 0 16px}
.speech-bubble::after{content:'';position:absolute;left:-12px;top:8px;width:12px;height:14px;background:var(--bg);border-radius:0 0 50% 0}

/* Options */
.options{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.option-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;font-family:inherit;font-size:0.95rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px}
.option-btn:hover{border-color:var(--primary);background:var(--surface-hi);transform:translateX(4px)}
.option-btn .option-icon{font-size:1.3rem;flex-shrink:0}

/* Progress bar */
.progress-bar{position:fixed;bottom:0;left:0;width:100%;height:4px;background:var(--surface)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--green));transition:width .5s ease;border-radius:0 2px 2px 0}

/* Footer nav */
.nav-bar{position:fixed;bottom:4px;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 24px}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 20px;font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s}
.nav-btn:hover{border-color:var(--primary);color:var(--text)}
.nav-hint{font-size:0.78rem;color:var(--text-dim)}

/* Final screen */
.final{text-align:center;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.final h1{font-size:2.5rem;font-weight:700;margin:20px 0 12px;background:linear-gradient(135deg,var(--primary),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.final p{color:var(--text-dim);font-size:1.05rem;margin-bottom:24px;line-height:1.6}
.buy-btn{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--green));color:#0d1117;font-family:inherit;font-size:1.1rem;font-weight:700;padding:16px 48px;border-radius:14px;border:none;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 0 30px rgba(161,250,255,.2)}
.buy-btn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(161,250,255,.35)}
.restart-link{display:inline-block;margin-top:16px;color:var(--text-dim);font-size:0.85rem;cursor:pointer;text-decoration:underline}
.restart-link:hover{color:var(--text)}

/* Fade transition */
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Confetti canvas */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}

@media(max-width:500px){
  .character-img{width:80px;height:80px}
  .speech-bubble{font-size:0.95rem;padding:14px 16px}
  .final h1{font-size:1.8rem}
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="survey-container" id="survey"></div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="nav-bar">
  <button class="nav-btn" id="backBtn" onclick="goBack()" style="visibility:hidden">&#9664;&#9664; BACK</button>
  <span class="nav-hint" id="hint"></span>
</div>

<script>
const W = '<a href="https://swap.wick.pics" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:700;font-size:1.4rem">$WICK</a>';
const STEPS = [
  // 0 — Entry
  {
    q: "Do you want to get rich anon?",
    opts: [
      {text: "Yes, let's do this!", icon: "&#128640;", next: 1},
      {text: "I'm HIM", icon: "&#129299;", next: 2},
      {text: "No, I want to stay middle-class", icon: "&#128064;", next: 5}
    ],
    hint: "This will only take a moment..."
  },
  // 1 — BUY $WICK (final for all paths)
  {
    q: 'BUY ' + W,
    opts: [],
    hint: "",
    final: true
  },
  // 2 — "I'm HIM" path
  {
    q: "Oh you're HIM? Prove it.<br>What are you holding?",
    opts: [
      {text: "100% $WICK obviously", icon: "&#128142;", next: 10},
      {text: "Nothing", icon: "&#128202;", next: 4},
      {text: "Just my Dick", icon: "&#127920;", next: 5}
    ],
    hint: "Choose carefully..."
  },
  // 3 — Already holds WICK
  {
    q: "You ARE him. But is your bag big enough? The answer is always no.",
    opts: [
      {text: "You're right... I need more", icon: "&#129761;", next: 1},
      {text: "My bag is massive", icon: "&#128011;", next: 8}
    ],
    hint: "There's never enough..."
  },
  // 4 — Diversified / vibes
  {
    q: "ROOKIE, Let me educate you..",
    opts: [
      {text: "OK fine, shill me", icon: "&#128566;", next: 1},
      {text: "like I'm going to take financial advice from a survey..", icon: "&#128580;", next: 9}
    ],
    hint: "Simplification is the ultimate sophistication..."
  },
  // 5 — Middle-class path
  {
    q: "Are you a faggot?",
    opts: [
      {text: "Fuck No, I aint no FAG", icon: "&#128170;", next: 1},
      {text: "The charts prove that RH is the only Gaybo around here", icon: "&#128200;", next: 6},
      {text: "You WISH, FAGGOT!", icon: "&#128405;", next: 7}
    ],
    hint: "Think carefully..."
  },
  // 6 — RH gaybo
  {
    q: "Fair point. RH can't even hold a floor.<br>You know who CAN? $WICK holders.",
    opts: [
      {text: "Sounds Legit", icon: "&#129309;", next: 1},
      {text: "Correlation isn't causation", icon: "&#129488;", next: 9}
    ],
    hint: "The data doesn't lie..."
  },
  // 7 — Towelie reversal
  {
    q: "The Towelie Reversal! Touché. You've got the energy... now channel it.",
    opts: [
      {text: "Into what?", icon: "&#129300;", next: 1}
    ],
    hint: "You already know..."
  },
  // 8 — Bag is massive
  {
    q: "That's what they ALL said before the last 10x. Don't be the guy who had \"enough\".",
    opts: [
      {text: "Fuck... you're right", icon: "&#128553;", next: 1}
    ],
    hint: "There's always another zero..."
  },
  // 9 — Defiant / skeptical
  {
    q: "You're literally still here reading this. The survey has already won.",
    opts: [
      {text: "...", icon: "&#128528;", next: 1}
    ],
    hint: ""
  },
  // 10 — Already holds WICK → BUY MORE
  {
    q: 'BUY MORE ' + W,
    opts: [],
    hint: "",
    final: true
  }
];

let history = [];
let currentStep = 0;

function render() {
  const container = document.getElementById('survey');
  const step = STEPS[currentStep];
  if (step.final) { showFinal(); return; }
  const totalSteps = 4; // pretend there are only a few steps
  const pct = Math.min(((history.length) / totalSteps) * 100, 95);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('hint').textContent = step.hint || '';
  document.getElementById('backBtn').style.visibility = history.length > 0 ? 'visible' : 'hidden';

  container.innerHTML = `
    <div class="fade-in">
      <div class="character-row">
        <img class="character-img" src="/wick.png" alt="Green Wick">
        <div class="speech-bubble">${step.q}</div>
      </div>
      ${step.opts.length ? `<div class="options">
        ${step.opts.map((o, i) => `
          <button class="option-btn" onclick="choose(${i})">
            <span class="option-icon">${o.icon}</span>
            ${o.text}
          </button>
        `).join('')}
      </div>` : ''}
    </div>
  `;
  if (step.final) launchConfetti();
}

function choose(idx) {
  const step = STEPS[currentStep];
  const opt = step.opts[idx];
  history.push(currentStep);

  if (opt.next === 'final') {
    showFinal();
  } else {
    currentStep = opt.next;
    render();
  }
}

function goBack() {
  if (history.length === 0) return;
  currentStep = history.pop();
  render();
}

function showFinal() {
  document.getElementById('progress').style.width = '100%';
  document.getElementById('hint').textContent = '';
  document.getElementById('backBtn').style.visibility = 'hidden';

  const container = document.getElementById('survey');
  container.innerHTML = `
    <div class="final">
      <img class="character-img" src="/wick.png" alt="Green Wick" style="margin:0 auto;display:block;width:140px;height:140px;border-width:4px">
      <h1>BUY $WICK</h1>
      <p>Our state-of-the-art survey algorithm, powered by advanced AI, years of market research, and the alignment of the stars has determined your optimal crypto strategy:</p>
      <p style="font-size:1.3rem;color:var(--primary);font-weight:700;margin-bottom:28px">Buy WICK on PulseChain.</p>
      <a href="https://swap.wick.pics" target="_blank" class="buy-btn">BUY WICK NOW &#128640;</a>
      <br>
      <span class="restart-link" onclick="restart()">Retake survey (same result)</span>
    </div>
  `;

  launchConfetti();
}

function restart() {
  history = [];
  currentStep = 0;
  render();
}

// ── Confetti ──────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#a1faff','#3fb950','#58a6ff','#f0e68c','#ff6b6b','#c084fc'];

  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 2,
      spin: Math.random() * 0.2 - 0.1,
      angle: Math.random() * Math.PI * 2
    });
  }

  let frame = 0;
  function animate() {
    if (frame > 180) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.x += p.vx;
      p.y += p.vy;
      p.angle += p.spin;
      p.vy += 0.05;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    frame++;
    requestAnimationFrame(animate);
  }
  animate();
}

// Start
render();
</script>
</body>
</html>
