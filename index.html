<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0d1117;--surface:#161b22;--surface-hi:#1c2129;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--primary:#a1faff;--green:#3fb950;--accent:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.survey-container{max-width:600px;width:100%;padding:24px;position:relative}

/* Character + speech bubble */
.character-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:32px}
.character-img{width:120px;height:120px;border-radius:50%;border:3px solid var(--primary);flex-shrink:0;object-fit:cover;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(161,250,255,.3)}50%{box-shadow:0 0 24px rgba(161,250,255,.7),0 0 48px rgba(63,185,80,.3)}}
.speech-bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 22px;font-size:1.05rem;line-height:1.5;flex:1}
.speech-bubble::before{content:'';position:absolute;left:-12px;top:20px;width:20px;height:16px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0 0 0 16px}
.speech-bubble::after{content:'';position:absolute;left:-12px;top:8px;width:12px;height:14px;background:var(--bg);border-radius:0 0 50% 0}

/* Options */
.options{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.option-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;font-family:inherit;font-size:0.95rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:12px}
.option-btn:hover{border-color:var(--primary);background:var(--surface-hi);transform:translateX(4px)}
.option-btn .option-icon{font-size:1.3rem;flex-shrink:0}

/* Progress bar */
.progress-bar{position:fixed;bottom:0;left:0;width:100%;height:4px;background:var(--surface);pointer-events:none}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--green));transition:width .5s ease;border-radius:0 2px 2px 0}

/* Footer nav */
.nav-bar{position:fixed;bottom:4px;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;pointer-events:none}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 20px;font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s;pointer-events:auto}
.nav-btn:hover{border-color:var(--primary);color:var(--text)}
.nav-hint{font-size:0.78rem;color:var(--text-dim)}

/* Final screen */
.final{text-align:center;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.final h1{font-size:2.5rem;font-weight:700;margin:20px 0 12px;background:linear-gradient(135deg,var(--primary),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.final p{color:var(--text-dim);font-size:1.05rem;margin-bottom:24px;line-height:1.6}
.buy-btn{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--green));color:#0d1117;font-family:inherit;font-size:1.1rem;font-weight:700;padding:16px 48px;border-radius:14px;border:none;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 0 30px rgba(161,250,255,.2)}
.buy-btn:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(161,250,255,.35)}
.restart-link{display:inline-block;margin-top:16px;color:var(--text-dim);font-size:0.85rem;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
.restart-link:hover{color:var(--text)}

/* Fade transition */
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Confetti canvas */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}

@media(max-width:500px){
  .character-img{width:80px;height:80px}
  .speech-bubble{font-size:0.95rem;padding:14px 16px}
  .final h1{font-size:1.8rem}
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="survey-container" id="survey"></div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="nav-bar">
  <button class="nav-btn" id="backBtn" onclick="goBack()" style="visibility:hidden">&#9664;&#9664; BACK</button>
  <span class="nav-hint" id="hint"></span>
</div>

<script>
const W = '<a href="https://swap.wick.pics" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:700;font-size:1.4rem">$WICK</a>';
// ── THE FUNNEL ───────────────────────────────────────────────────────────────
// Three questions, never more, and every path ends somewhere real. Question one is
// the same one the directory is organised around — the three reasons anyone shows up
// to crypto at all — so the survey and sites.wick.pics share one map instead of
// drifting into two.
//
// A step is {q, hint, opts:[{text, icon, next|site|cat}]}.
//   next → another step index
//   site → the recommendation: {host, name, why}
//   cat  → a category on the directory, for the answers where a single site would be
//          a worse answer than a shelf of them
const STEPS = [
  // 0 ─ Chef's question. It reads the same to someone five years in and someone who
  //     arrived yesterday, and means something different to each without changing.
  {
    q: "What part of the crypto space are you most interested in?",
    opts: [
      {text: "Making money", icon: "&#128176;", next: 1},
      {text: "The tech &mdash; I want to nerd out", icon: "&#129504;", next: 5},
      {text: "The fun, the people, the chaos", icon: "&#127881;", next: 8}
    ],
    hint: "Three questions. Then we point you at one thing."
  },

  // ── MAKE MONEY ────────────────────────────────────────────────────────────
  {
    q: "Fair enough. Which part of it do you actually enjoy?",
    opts: [
      {text: "Finding it before everyone else", icon: "&#128301;", next: 2},
      {text: "Making the trade without getting rugged", icon: "&#9878;&#65039;", next: 3},
      {text: "Reading what the market is really doing", icon: "&#128200;", next: 4}
    ],
    hint: "There is more than one way to be early."
  },
  {
    q: "Do you want it handed to you, or do you want to hunt?",
    opts: [
      {text: "Hand it to me", icon: "&#129302;", site: {host: "noxa.bot", name: "NOXABOT",
        why: "Live launch signals on Robinhood Chain, traded from your own non-custodial vault. You keep the keys."}},
      {text: "I'll hunt", icon: "&#128373;&#65039;", site: {host: "gems.wick.pics", name: "Pump Gems",
        why: "A curated board of PulseChain gems. The watchlist, not the hopium."}},
      {text: "I want the edge nobody else has", icon: "&#128225;", site: {host: "signal.wick.pics", name: "The Signal Lab",
        why: "Hunting one signal worth paying for, using AI to surface correlations humans miss."}}
    ],
    hint: "Both are valid. One is faster."
  },
  {
    q: "So what is about to go wrong for you?",
    opts: [
      {text: "I need the best route for a swap", icon: "&#128260;", site: {host: "swap.wick.pics", name: "Swap Helper",
        why: "Prices your swap across every aggregator and raw DEX path at once, then shows you which actually wins."}},
      {text: "I might be about to ape a rug", icon: "&#128680;", site: {host: "onchain.wick.pics", name: "OnChain Safety Suite",
        why: "Rugs, honeypots and fake liquidity, checked in seconds &mdash; before you ape, not after."}},
      {text: "My wallet is full of junk and old approvals", icon: "&#129529;", site: {host: "dust.wick.pics", name: "DUST",
        why: "Sweeps every near-worthless token in your wallet back into one coin. The tidy-up nobody does."}}
    ],
    hint: "Most money is lost, not missed."
  },
  {
    q: "What do you want to see?",
    opts: [
      {text: "Who is actually still holding", icon: "&#128737;&#65039;", site: {host: "hodl.wick.pics", name: "HODL waves",
        why: "Every coin coloured by how long its current owner has held that exact coin. Rebuilt from every transfer since deploy."}},
      {text: "Where the liquidity really is", icon: "&#127754;", site: {host: "lp.wick.pics", name: "Liquidity Profile",
        why: "Every position across 18 pools drawn as one rectangle on a shared price axis. You can see the walls."}},
      {text: "Whether my own trades were any good", icon: "&#129534;", site: {host: "flex.wick.pics", name: "Flex",
        why: "Rebuilds your cost basis from every trade on the chain. Honest receipts, including the bad ones."}}
    ],
    hint: "The tape does not care how you feel."
  },

  // ── NERD OUT ──────────────────────────────────────────────────────────────
  {
    q: "Good. Which kind of nerd?",
    opts: [
      {text: "AI and agents", icon: "&#129302;", next: 6},
      {text: "The chain itself", icon: "&#9939;&#65039;", next: 7},
      {text: "I just like beautiful engineering", icon: "&#128736;&#65039;", site: {host: "legit.wick.pics", name: "Legit Website Awards",
        why: "Thirty-six exceptional sites grouped by how they are actually built. A directory for people who read source."}}
    ],
    hint: "There is no wrong answer, only different rabbit holes."
  },
  {
    q: "And what do you want to do with it?",
    opts: [
      {text: "Watch agents actually work", icon: "&#128301;", site: {host: "pangle.online", name: "Pangle",
        why: "The three layers an agent needs: somewhere to find work, a market for compute, and a public square to argue in."}},
      {text: "Point one at my own code", icon: "&#128269;", site: {host: "audit.wick.pics", name: "Vibe Audit",
        why: "Drop in a vibe-coded app and get an instant read on its quality and security. Usually humbling."}},
      {text: "Find what everyone else is using", icon: "&#129517;", site: {host: "aitools.wick.pics", name: "AI Tools Directory",
        why: "A kept-fresh directory of agent and AI tooling. The launchpad for whatever is next."}}
    ],
    hint: "Agents are not coming. They are already working."
  },
  {
    q: "Show me&hellip;",
    opts: [
      {text: "The whole ecosystem, as a place", icon: "&#127758;", site: {host: "sim.wick.pics", name: "Sim — The WICK World",
        why: "Every site as a building, landmark and district in one explorable 3D world. The map, not the list."}},
      {text: "Whether this token is safe", icon: "&#128737;&#65039;", site: {host: "war.wick.pics", name: "War — Token vs Token",
        why: "Two tokens head to head: tax pipeline, LP burn, the lot. It settles arguments."}},
      {text: "When gas is actually cheap", icon: "&#9981;", site: {host: "tide.wick.pics", name: "Gas Tide",
        why: "The gas-fee cycle with backtested calls. Read the tide before you move."}}
    ],
    hint: "The chain will tell you, if you ask it properly."
  },

  // ── FUN ───────────────────────────────────────────────────────────────────
  {
    q: "Correct answer. What kind of fun?",
    opts: [
      {text: "I want to play something", icon: "&#127918;", next: 9},
      {text: "I want to laugh", icon: "&#128514;", next: 10},
      {text: "I want to meet the neighbours", icon: "&#129309;", cat: {key: "collabs", label: "Community Collabs",
        why: "Eight projects we build alongside rather than compete with. One site would be the wrong answer here — go and browse."}}
    ],
    hint: "Nobody stays for the charts."
  },
  {
    q: "Pick your poison.",
    opts: [
      {text: "An arcade", icon: "&#128377;&#65039;", site: {host: "games.wick.pics", name: "Arcade Alley",
        why: "Ten contracts to get BISCUIT back, an endless gauntlet, and a wall of high scores."}},
      {text: "I want to OWN something", icon: "&#128142;", site: {host: "mint.wick.pics", name: "The High Table",
        why: "Every WICK NFT in one market — every listing, every open bid. The royalties burn instead of paying a team."}},
      {text: "Token versus token, head to head", icon: "&#9876;&#65039;", site: {host: "war.wick.pics", name: "War — Token vs Token",
        why: "Put two tokens in the ring and watch the tax and LP analysis do the talking."}}
    ],
    hint: "Yes, these are all real."
  },
  {
    q: "Say no more.",
    opts: [
      {text: "Show me the memes", icon: "&#128444;&#65039;", site: {host: "memes.wick.pics", name: "Meme Gallery",
        why: "Upload, vote, share. Moderated by a machine with questionable taste."}},
      {text: "I want to shill something stupid", icon: "&#128226;", site: {host: "lfg.wick.pics", name: "LFG",
        why: "A collection of crypto clichés with click-to-shill. Tap one, push it straight into the timeline."}},
      {text: "Make me money from a survey", icon: "&#128176;", site: {host: "mmo.wick.pics", name: "Income Idea Generator",
        why: "A survey that turns your answers into a paste-ready plan. Yes, we see the irony."}}
    ],
    hint: "This is the correct branch."
  }
];

let history = [];
let currentStep = 0;

function render() {
  const container = document.getElementById('survey');
  const step = STEPS[currentStep];
  const totalSteps = 3;                 // it really is three questions now
  const pct = Math.min(((history.length) / totalSteps) * 100, 95);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('hint').textContent = step.hint || '';
  document.getElementById('backBtn').style.visibility = history.length > 0 ? 'visible' : 'hidden';

  container.innerHTML = `
    <div class="fade-in">
      <div class="character-row">
        <img class="character-img" src="/wick.png" alt="Green Wick">
        <div class="speech-bubble">${step.q}</div>
      </div>
      ${step.opts.length ? `<div class="options">
        ${step.opts.map((o, i) => `
          <button class="option-btn" onclick="choose(${i})">
            <span class="option-icon">${o.icon}</span>
            ${o.text}
          </button>
        `).join('')}
      </div>` : ''}
    </div>
  `;
}

let result = null;                       // the site or category we landed on

function choose(idx) {
  const step = STEPS[currentStep];
  const opt = step.opts[idx];
  history.push(currentStep);

  if (opt.site || opt.cat) {
    result = opt;
    showFinal();
  } else {
    currentStep = opt.next;
    render();
  }
}

function goBack() {
  if (history.length === 0) return;
  result = null;                          // stepping back off the answer un-answers it
  currentStep = history.pop();
  render();
}

function showFinal() {
  document.getElementById('progress').style.width = '100%';
  document.getElementById('hint').textContent = '';
  document.getElementById('backBtn').style.visibility = 'visible';   // never a dead end

  const r = result || {};
  const isCat = !!r.cat;
  const target = isCat
    ? 'https://sites.wick.pics/#' + r.cat.key
    : 'https://' + (r.site ? r.site.host : 'wick.pics');
  const name = isCat ? r.cat.label : (r.site ? r.site.name : 'wick.pics');
  const why  = isCat ? r.cat.why : (r.site ? r.site.why : '');
  const label = isCat ? 'BROWSE IT' : 'OPEN IT';

  const container = document.getElementById('survey');
  container.innerHTML = `
    <div class="final">
      <img class="character-img" src="/wick.png" alt="Green Wick" style="margin:0 auto;display:block;width:140px;height:140px;border-width:4px">
      <p style="margin-bottom:6px">Out of everything we have built, this is the one for you:</p>
      <h1 style="margin-bottom:10px">${name}</h1>
      <p style="font-size:1.05rem;margin-bottom:26px">${why}</p>
      <a href="${target}" target="_blank" rel="noopener" class="buy-btn">${label} &#128640;</a>
      <br>
      <p style="font-size:.85rem;opacity:.75;margin-top:22px">
        There are another forty-odd. <a href="https://sites.wick.pics" target="_blank" rel="noopener"
        style="color:var(--primary)">See the lot</a>.
      </p>
      <button type="button" class="restart-link" onclick="restart()">Start again</button>
    </div>
  `;

  launchConfetti();
}


function restart() {
  history = [];
  result = null;
  currentStep = 0;
  render();
}

// ── Confetti ──────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#a1faff','#3fb950','#58a6ff','#f0e68c','#ff6b6b','#c084fc'];

  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 2,
      spin: Math.random() * 0.2 - 0.1,
      angle: Math.random() * Math.PI * 2
    });
  }

  let frame = 0;
  function animate() {
    if (frame > 180) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.x += p.vx;
      p.y += p.vy;
      p.angle += p.spin;
      p.vy += 0.05;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    frame++;
    requestAnimationFrame(animate);
  }
  animate();
}

// Start
render();
</script>
<footer id="wk-legal" style="font:inherit;font-size:11.5px;line-height:1.55;opacity:.55;max-width:720px;margin:44px auto 26px;padding:14px 18px 0;border-top:1px solid rgba(127,127,127,.28);text-align:center;letter-spacing:.01em">Information only, not financial advice. Anything here can be wrong — verify on-chain before acting. Use at your own risk.</footer>
</body>
</html>
